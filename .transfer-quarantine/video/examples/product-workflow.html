<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneShot product workflow storyboards</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:1600px;height:900px;overflow:hidden}
    body{font-family:"Segoe UI Variable","Segoe UI",sans-serif;background:#081027;color:#f5f9ff}
    #app{position:relative;width:1600px;height:900px;overflow:hidden;isolation:isolate}
    #app:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at var(--mx,75%) var(--my,35%),var(--halo,#0a4d70) 0,transparent 35%),linear-gradient(135deg,var(--bg1,#080f27),var(--bg2,#111c39))}
    .grain{position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#7ac8ff 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(90deg,transparent,#000 45%,transparent)}
    .top{position:absolute;left:72px;right:72px;top:42px;display:flex;justify-content:space-between;align-items:center;z-index:5}
    .brand{display:flex;gap:15px;align-items:center;font-size:23px;font-weight:800;letter-spacing:-.035em}.brandmark{width:27px;height:27px;border:3px solid var(--accent,#5ee9f4);border-radius:9px;transform:rotate(45deg);box-shadow:0 0 22px var(--accent,#5ee9f4)}
    .topright{display:flex;align-items:center;gap:18px;color:var(--muted,#a1b8d0);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.live{width:9px;height:9px;border-radius:50%;background:var(--accent,#5ee9f4);box-shadow:0 0 14px var(--accent,#5ee9f4)}
    .footer{position:absolute;left:72px;right:72px;bottom:28px;display:flex;justify-content:space-between;align-items:center;color:var(--muted,#91a9c4);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-top:1px solid var(--rule,#30435f);padding-top:17px;z-index:7}
    .footer b{color:var(--accent,#5ee9f4)}.bar{width:150px;height:4px;border-radius:4px;background:#3e5473;overflow:hidden}.bar i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--accent,#5ee9f4);box-shadow:0 0 15px var(--accent,#5ee9f4)}
    .eyebrow{text-transform:uppercase;letter-spacing:.17em;font-size:15px;color:var(--accent,#5ee9f4);font-weight:800}
    h1,h2,h3,p{margin:0}h1{font-size:66px;line-height:1.03;letter-spacing:-.055em;font-weight:800}h2{font-size:39px;line-height:1.08;letter-spacing:-.04em}h3{font-size:21px;letter-spacing:-.02em}p{line-height:1.5;color:var(--muted,#adc1d9)}
    .sub{font-size:20px;line-height:1.42;max-width:680px;margin-top:20px}.panel{background:var(--panel,#122144);border:1px solid var(--stroke,#315479);border-radius:24px;box-shadow:0 20px 60px #0005, inset 0 1px #ffffff12}
    .panel.glow{box-shadow:0 0 0 1px var(--accent,#5ee9f4),0 0 42px #38c9ff33,0 28px 70px #0007}
    .tag{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--stroke,#436783);border-radius:999px;background:var(--tag,#182a4d);color:var(--text,#dff4ff);padding:9px 14px;font-size:13px;font-weight:750;letter-spacing:.015em;white-space:nowrap}.tag i{width:7px;height:7px;border-radius:50%;background:var(--accent,#5ee9f4);box-shadow:0 0 10px var(--accent,#5ee9f4)}
    .status{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent,#5ee9f4)}.status:before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 16px currentColor}
    .row{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule,#304362);font-size:17px}.row:last-child{border:0}.row .idx{color:var(--accent,#5ee9f4);font-weight:850;font-size:14px;width:29px}.row .detail{margin-left:auto;color:var(--muted,#9eb4cc);font-size:13px}.row .ok{margin-left:auto;color:#6cf5bb;font-size:18px}
    .meter{height:11px;border-radius:20px;background:var(--rule,#2a3d5c);overflow:hidden}.meter i{height:100%;width:calc(var(--p)*100%);display:block;background:linear-gradient(90deg,var(--accent,#5ee9f4),var(--accent2,#819cff));border-radius:20px;box-shadow:0 0 18px var(--accent,#5ee9f4)}
    .bot{position:absolute;object-fit:contain;filter:drop-shadow(0 20px 60px #02071a9c) drop-shadow(0 0 28px #3fc7ff52);transform:translateY(calc((1 - var(--p))*22px));z-index:4}
    .trace{position:absolute;pointer-events:none;z-index:2;overflow:visible}.trace path{fill:none;stroke:var(--accent,#5ee9f4);stroke-width:4;filter:drop-shadow(0 0 8px var(--accent,#5ee9f4))}.trace .base{stroke:var(--rule,#344967);stroke-width:3;filter:none}.trace .progress{stroke-dasharray:var(--len,1200);stroke-dashoffset:calc(var(--len,1200)*(1 - var(--p)))}
    .ring{border:1px solid var(--accent,#5ee9f4);border-radius:50%;box-shadow:0 0 35px #27d6ff44,inset 0 0 35px #27d6ff22}.fade{opacity:calc(.5 + var(--p)*.5)}
    .light{color:#172438;--muted:#52667c;--panel:#fff;--stroke:#d4e0e9;--rule:#dce4e8;--tag:#eef6fa;--text:#263e50}
    .light .footer{color:#61778c}.light .brand{color:#172438}.light .topright{color:#597087}.light .panel{box-shadow:0 20px 50px #0b2b5120, inset 0 1px #fff}
    .scene1{--bg1:#071328;--bg2:#0c2641;--halo:#0c6680;--accent:#58f1ed;--accent2:#7a91ff;--panel:#102b48;--stroke:#2e7996;--rule:#25506a}
    .scene2{--bg1:#051523;--bg2:#082e3b;--halo:#0b695f;--accent:#65edc8;--accent2:#5ba7ff;--panel:#0e2d39;--stroke:#236f77;--rule:#23515b}
    .scene3{--bg1:#130c24;--bg2:#261a3d;--halo:#6d3146;--accent:#ffba71;--accent2:#b69cff;--panel:#261d40;--stroke:#785379;--rule:#574565}
    .scene4{--bg1:#f3f7fa;--bg2:#e8f4f1;--halo:#c9e5e4;--accent:#177b92;--accent2:#e79e54}
    .scene5{--bg1:#111b2c;--bg2:#17283b;--halo:#794b2e;--accent:#ffb579;--accent2:#65e7be;--panel:#182c43;--stroke:#4b6478;--rule:#3b5669}
    .scene6{--bg1:#080e1c;--bg2:#102647;--halo:#225c7e;--accent:#79caff;--accent2:#8feec4;--panel:#112943;--stroke:#43799c;--rule:#2c5270}
    .scene7{--bg1:#0b1023;--bg2:#1e1b43;--halo:#443684;--accent:#b3a2ff;--accent2:#78edff;--panel:#1c2347;--stroke:#555b96;--rule:#3d4674}
    .scene8{--bg1:#1c1721;--bg2:#372237;--halo:#86413c;--accent:#ff997b;--accent2:#80e6d7;--panel:#322739;--stroke:#83586c;--rule:#674756}
    .scene9{--bg1:#071a19;--bg2:#13372f;--halo:#166454;--accent:#8df2b4;--accent2:#69dff7;--panel:#173a35;--stroke:#3a8673;--rule:#366559}
    .scene10{--bg1:#f5f9fa;--bg2:#e5f2f7;--halo:#d2eafb;--accent:#177ca4;--accent2:#798ded}
    .scene1 .hero{position:absolute;left:90px;top:194px;width:800px}.scene1 .bot{width:700px;height:710px;right:-48px;top:98px}.scene1 h1 em,.scene10 h1 em{font-style:normal;color:var(--accent)}
    .request{position:absolute;left:90px;top:490px;width:800px;padding:28px 32px}.request .entry{font-size:22px;font-weight:650;margin:17px 0 24px}.request .send{background:var(--accent);color:#082039;border-radius:12px;padding:12px 20px;font-weight:850;float:right}.stepchips{display:flex;gap:10px;position:absolute;left:90px;bottom:116px}
    .scene2 .headline{position:absolute;left:78px;top:145px}.scene2 .files{position:absolute;left:78px;top:360px;width:560px;padding:24px 30px}.scene2 .evidence{position:absolute;right:80px;top:225px;width:730px;padding:34px 39px}.scene2 .mini-bot{position:absolute;left:680px;bottom:107px;width:210px;opacity:.9}
    .scene2 .headline h1{font-size:56px}.scene2 .headline .sub{max-width:650px}
    .scene3 .headline{position:absolute;left:80px;top:145px}.scene3 .radar{position:absolute;left:85px;top:340px;width:535px;height:440px;border:1px solid #91698b;border-radius:48%;background:radial-gradient(circle,#5930466d 0,#2c213f88 35%,transparent 70%);box-shadow:0 0 90px #ff9d7130}.scene3 .radar:before,.scene3 .radar:after{content:"";position:absolute;inset:65px;border:1px dashed #b99a9b;border-radius:50%}.scene3 .radar:after{inset:140px}.scene3 .radarcore{position:absolute;left:165px;top:120px;width:205px;height:205px;border-radius:50%;display:grid;place-items:center;font-size:78px;background:#342947;box-shadow:0 0 60px #ff9d715b}.scene3 .issues{position:absolute;right:78px;top:210px;width:790px;padding:36px 40px}
    .scene3 .headline .sub{max-width:600px}.scene3 .radar svg{position:absolute;inset:0;width:100%;height:100%}.scene3 .radar svg path{stroke:#ffc38a;stroke-width:2;stroke-dasharray:6 8;opacity:.6;fill:none}.scene3 .radar svg circle{fill:#ffbd82;filter:drop-shadow(0 0 11px #ffac6d)}
    .scene4 .headline{position:absolute;left:80px;top:135px}.scene4 .spec{position:absolute;left:80px;top:355px;width:640px;padding:30px}.scene4 .todo{position:absolute;right:80px;top:250px;width:700px;padding:31px}.scene4 .todo .row{font-size:18px}
    .scene5 .headline{position:absolute;left:80px;top:135px}.scene5 .reject{position:absolute;left:80px;top:340px;width:650px;height:355px;padding:35px}.scene5 .correct{position:absolute;right:80px;top:340px;width:650px;height:355px;padding:35px}.scene5 .arrow{position:absolute;left:745px;top:473px;font-size:76px;color:#fff3;text-shadow:0 0 25px #ffbb7a}
    .scene6 .headline{position:absolute;left:80px;top:135px}.scene6 .core{position:absolute;left:580px;top:315px;width:440px;height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#163f65 0,#0c203d 65%);border:2px solid var(--accent);border-radius:50%;box-shadow:0 0 95px #52baff45,inset 0 0 65px #45b5ed2a;text-align:center}.scene6 .core strong{font-size:104px;line-height:1}.scene6 .core b{font-size:35px}.scene6 .gateleft{position:absolute;left:82px;top:360px;width:420px}.scene6 .gateright{position:absolute;right:82px;top:360px;width:420px}
    .scene7 .headline{position:absolute;left:76px;top:133px}.scene7 .editor{position:absolute;left:76px;top:337px;width:905px;height:450px;overflow:hidden}.scene7 .editorhead{height:54px;padding:18px 23px;border-bottom:1px solid var(--rule);font:16px Consolas,monospace;color:var(--accent2)}.scene7 pre{font:17px/1.75 Consolas,monospace;color:#bfc9f9;margin:27px 36px}.scene7 .buildrail{position:absolute;right:76px;top:267px;width:485px;padding:30px}
    .scene8 .headline{position:absolute;left:76px;top:135px}.scene8 .timeline{position:absolute;left:76px;right:76px;top:340px;height:390px;padding:40px}.scene8 .timegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:45px}.scene8 .timeblock{border:1px solid #9c6f79;border-radius:16px;padding:23px;min-height:195px;background:#4433449c}.scene8 .timeblock .num{font-size:14px;color:var(--accent);font-weight:800}.scene8 .timeblock h3{margin:22px 0 8px}
    .scene9 .headline{position:absolute;left:78px;top:135px}.scene9 .verify{position:absolute;left:78px;top:345px;width:950px;padding:32px}.scene9 .score{position:absolute;right:78px;top:290px;width:405px;height:430px;padding:35px;text-align:center}.scene9 .score strong{display:block;font-size:140px;letter-spacing:-.08em;line-height:1.2;color:var(--accent)}
    .scene10 .headline{position:absolute;left:80px;top:150px}.scene10 .deliver{position:absolute;left:80px;top:405px;width:900px;padding:34px}.scene10 .bot{right:55px;top:185px;width:545px;height:560px}.scene10 .receipt{position:absolute;right:82px;top:695px;width:490px;padding:17px 23px;border-radius:17px;background:#eaf9f4;border:1px solid #b2dacc;color:#286b58;font-size:15px;font-weight:800}
  </style>
</head>
<body><div id="app"></div>
<script>
const params=new URLSearchParams(location.search);
const scene=Math.max(1,Math.min(10,Number(params.get('scene'))||1));
const frame=Math.max(0,Math.min(39,Number(params.get('frame'))||0));
const p=(frame+1)/40;
const at=(n)=>p>=n;
const sceneNames=['Request','Research','Audit discovery','Planning','Fixture validation','Host control','Build','Recovery','Build verification','Delivery'];
const sceneNotes=['From one request to a governed task','Evidence tied to repository files','Read-only findings with severity','A concrete BuildSpecification','Independent observations, then correction','Exact actions admitted by the Host','Admitted work with visible receipts','Checkpoint, reconcile, resume','Independent acceptance checks','A reviewable result'];
const assistant='../assets/oneshot-assistant.png';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const bot=(cls='bot')=>`<img class="${cls}" src="${assistant}" alt="">`;
const tag=(label)=>`<span class="tag"><i></i>${esc(label)}</span>`;
const row=(index,label,detail='',done=false)=>`<div class="row"><span class="idx">${index}</span><span>${esc(label)}</span><span class="${done?'ok':'detail'}">${done?'✓':esc(detail)}</span></div>`;
const panel=(cls,inner)=>`<section class="panel ${cls}">${inner}</section>`;
const heading=(kicker,title,sub)=>`<div class="headline"><div class="eyebrow">${kicker}</div><h1 style="margin-top:16px">${title}</h1><p class="sub">${sub}</p></div>`;
function content(){
  if(scene===1)return `<div class="hero"><div class="eyebrow">System Chat / new request</div><h1 style="margin-top:20px">Ask once.<br><em>See the work.</em></h1><p class="sub">“Audit the frontend for accessibility and narrow-view issues.”<br>The Host creates a task before any worker runs.</p></div>${bot()}${panel('request glow',`<div class="status">${at(.35)?'Task created':'Ready for request'}</div><div class="entry">Audit the frontend for accessibility and narrow-view issues</div><div style="display:flex;justify-content:space-between;align-items:center">${tag('Purpose: Audit')}<span class="send">${at(.4)?'Request sent ✓':'Send request ↗'}</span></div>`)}<div class="stepchips">${['Research','Audit discovery','Planning','Fixture validation','Build'].map(tag).join('')}</div>`;
  if(scene===2)return `${heading('01 / Research','Evidence before decisions.','The Researcher reads the request and pins observations to source files. The Host persists the evidence.')}${panel('files',`<div class="eyebrow">Workspace index</div><h3 style="margin:13px 0 19px">Relevant files</h3>${row('01','web/src/main.jsx','UI behavior',at(.24))}${row('02','web/src/styles.css','Responsive layout',at(.45))}${row('03','web/tests/audit.spec.js','Observed checks',at(.68))}${row('04','settings/config.yaml','Provider settings',at(.86))}`)}${panel('evidence glow',`<div class="status">${at(.82)?'Evidence persisted':'Reading source'}</div><h2 style="margin:23px 0">What the repository shows</h2><p style="font-size:20px">Frontend audit covers interactive labels, narrow viewport behavior, and existing regression checks.</p><div style="height:30px"></div>${row('A','Source locations','linked',at(.42))}${row('B','Acceptance criteria','drafted',at(.68))}${row('C','Scope boundaries','recorded',at(.89))}<div style="margin-top:25px">${tag('task_research.json')}</div>`)}${bot('mini-bot')}`;
  if(scene===3)return `${heading('02 / Audit discovery','Find what matters.','A read-only audit compares source behavior with the request and records candidate CodeIntent.')}
    <div class="radar"><svg viewBox="0 0 535 440"><path d="M267 220L77 193M267 220L417 88M267 220L446 337"/><circle cx="77" cy="193" r="9"/><circle cx="417" cy="88" r="9"/><circle cx="446" cy="337" r="9"/></svg><div class="radarcore">⌕</div></div>${panel('issues glow',`<div class="status">Read-only inspection</div><h2 style="margin:21px 0 24px">Frontend findings</h2>${row('01','Missing aria label','medium',at(.24))}${row('02','Narrow view overflow','medium',at(.52))}${row('03','No visual regression','low',at(.79))}<div style="display:flex;gap:10px;margin-top:28px">${tag('3 findings')}${tag('4 areas checked')}${tag('No source changes')}</div>`)}`;
  if(scene===4)return `${heading('03 / Planning','Turn findings into a plan.','The Planner drafts actions and checks. The Host freezes the specification before work can be admitted.')}${panel('spec glow',`<div class="eyebrow">BuildSpecification / rev 1</div><h2 style="margin:17px 0 20px">A precise change set</h2><p style="font-size:19px">Update accessible names, fix narrow-layout overflow, and add an end-to-end viewport check.</p><div style="height:35px"></div>${tag('Acceptance criteria included')} ${tag(at(.82)?'Host freeze recorded':'Host freeze pending')}`)}${panel('todo',`<div class="status">Planning work</div><h3 style="font-size:27px;margin:20px 0">TODOs and evidence</h3>${row('01','Accessible name on controls','UI + test',at(.32))}${row('02','Responsive overflow fix','CSS + test',at(.54))}${row('03','Viewport E2E check','browser',at(.76))}${row('04','Review affected routes','scope',at(.91))}`)}`;
  if(scene===5)return `${heading('04 / Fixture validation','Catch a gap before Build.','Independent fixture observations can reject a plan. The Planner corrects it; the Host rechecks the result.')}${panel('reject',`<div class="eyebrow" style="color:#ffba83">Observation / ${at(.56)?'resolved':'blocked'}</div><h2 style="margin:25px 0">${at(.56)?'Missing digest pinned':'Tool provenance missing'}</h2><p style="font-size:19px">${at(.56)?'The requested tool now matches the Host registry snapshot.':'A requested tool lacks the executable identity required by the Host registry snapshot.'}</p><div style="margin-top:45px">${tag('No Build effect authorized')}</div>`)}<div class="arrow">➜</div>${panel('correct glow',`<div class="eyebrow" style="color:#74ecc5">Correction / recheck</div><h2 style="margin:25px 0">${at(.72)?'Fixture checks pass':'Planner revises spec'}</h2><p style="font-size:19px">Pin tool identity, re-freeze the specification, and rerun independent observations.</p><div style="margin-top:45px">${tag(at(.72)?'Ready for Host gate':'Waiting for recheck')}</div>`)}`;
  if(scene===6)return `${heading('Host control / Build boundary','The gate is a decision.','Build admission is a Host check on exact actions, not another stage in the workflow.')}${panel('gateleft',`<div style="padding:26px"><div class="eyebrow">Input to gate</div>${row('01','Frozen specification','locked',at(.2))}${row('02','Registry identity','digest',at(.4))}${row('03','Authorized actions','exact IDs',at(.6))}</div>`)}<div class="core"><strong>${at(.74)?'✓':'◇'}</strong><b>${at(.74)?'Admitted':'Host gate'}</b><p style="margin-top:18px;font-size:17px">Default deny · effect-time recheck</p></div>${panel('gateright',`<div style="padding:26px"><div class="eyebrow">Host receipt</div>${row('A','Allowed tool IDs','derived',at(.74))}${row('B','Sandbox profile','pinned',at(.74))}${row('C','Build actions','bounded',at(.74))}</div>`)}`;
  if(scene===7)return `${heading('05 / Build','Watch admitted work run.','The Builder executes exact admitted operations. Every effect is rechecked by the Host and recorded.')}${panel('editor',`<div class="editorhead">◉ &nbsp; web/src/main.jsx &nbsp; / &nbsp; accessibility.patch</div><pre><span style="color:#8b99bb">118</span>  function RequestComposer() {\n<span style="color:#8b99bb">119</span>    return &lt;button\n<span style="color:#ff9e9e">-120</span>      className="send"\n<span style="color:#8df0cf">+120</span>      aria-label="Submit task"\n<span style="color:#8df0cf">+121</span>      className="send"\n<span style="color:#8b99bb">122</span>    /&gt;\n\n<span style="color:#a69bf7">// Narrow viewport check included</span></pre>`)}${panel('buildrail glow',`<div class="status">${at(.85)?'Build receipt stored':'Build in progress'}</div><h3 style="font-size:29px;margin:20px 0">Admitted actions</h3>${row('01','Accessible names','',at(.24))}${row('02','Responsive layout','',at(.48))}${row('03','Browser viewport check','',at(.74))}${row('04','Review + receipt','',at(.9))}<div style="margin-top:30px" class="meter"><i></i></div><p style="margin-top:12px">${Math.round(p*100)}% observed</p>`)}`;
  if(scene===8)return `${heading('Build / interruption path','A failure has a next step.','The Host records completed work, checks the checkpoint, and authorizes a safe resume.')}${panel('timeline glow',`<div class="status">${at(.74)?'Resumed after recheck':at(.34)?'Execution interrupted':'Build running'}</div><div class="timegrid"><div class="timeblock"><div class="num">01 / completed</div><h3>Work persisted</h3><p>Earlier admitted actions have receipts.</p></div><div class="timeblock"><div class="num">02 / interruption</div><h3>Worker disconnects</h3><p>Partial work is isolated. No success is claimed.</p></div><div class="timeblock"><div class="num">03 / Host check</div><h3>Checkpoint read</h3><p>Identity, admission, and effects are reconciled.</p></div><div class="timeblock"><div class="num">04 / resume</div><h3>${at(.74)?'Work continues':'Safe to continue'}</h3><p>Only remaining authorized work proceeds.</p></div></div><div class="meter" style="margin-top:40px"><i></i></div>`)}`;
  if(scene===9)return `${heading('Build / independent verification','Prove the result.','The Build Verifier checks acceptance criteria independently and records the observed outcome.')}${panel('verify glow',`<div class="eyebrow">Acceptance criteria / observed checks</div><div style="margin-top:21px">${row('01','Controls have accessible names','browser E2E',at(.16))}${row('02','Narrow viewport has no overflow','browser E2E',at(.31))}${row('03','No regressions in task flow','test suite',at(.48))}${row('04','Tool identity rechecked','receipt',at(.65))}${row('05','Artifacts match specification','digest',at(.8))}${row('06','Final result is reviewable','artifact',at(.92))}</div>`)}${panel('score',`<div class="status" style="justify-content:center">Independent verifier</div><strong>${Math.min(6,Math.floor(p*6))}/6</strong><h3 style="font-size:30px">Criteria observed</h3><p style="margin-top:17px">A pass is recorded only after the check runs.</p><div style="margin-top:30px">${tag('verification receipt')}</div>`)}`;
  return `<div class="headline"><div class="eyebrow">Result / reviewable output</div><h1 style="margin-top:16px">Work complete.<br><em>Evidence attached.</em></h1><p class="sub">One request became a bounded, checked change. The result includes its artifacts and Host receipts.</p></div>${panel('deliver glow',`<div class="status">${at(.8)?'Verified completion':'Preparing result'}</div><h2 style="margin:18px 0 25px">Frontend accessibility audit</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px 40px">${row('A','Research evidence','saved',at(.25))}${row('B','Audit findings','saved',at(.45))}${row('C','Frozen plan','saved',at(.65))}${row('D','Build result','saved',at(.82))}</div><div style="margin-top:27px" class="meter"><i></i></div>`)}${bot()}<div class="receipt">✓ &nbsp; Host receipt · independent verification recorded</div>`;
}
const app=document.getElementById('app');
