name: Temporary scanner code formatter
on:
  push:
    branches: [feat/scanner-evidence-trace-20261106]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
      - name: Format targeted code and commit
        run: |
          uv sync --locked --extra meta --extra mvp
          uv run --no-sync ruff check --fix agent/contracts/scanner.py agent/contracts/validation/planning.py agent/runtime/scanner_gateway.py agent/runtime/scanner_telemetry.py agent/runtime/controller.py mvp/api.py tests/scanner/test_decision_trace.py || true
          uv run --no-sync ruff format agent/contracts/scanner.py agent/contracts/validation/planning.py agent/runtime/scanner_gateway.py agent/runtime/scanner_telemetry.py agent/runtime/controller.py mvp/api.py tests/scanner/test_decision_trace.py
          uv run --no-sync ruff check agent/contracts/scanner.py agent/contracts/validation/planning.py agent/runtime/scanner_gateway.py agent/runtime/scanner_telemetry.py agent/runtime/controller.py mvp/api.py tests/scanner/test_decision_trace.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/contracts/scanner.py agent/contracts/validation/planning.py agent/runtime/scanner_gateway.py agent/runtime/scanner_telemetry.py agent/runtime/controller.py mvp/api.py tests/scanner/test_decision_trace.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff checks and formatting to scanner slice"
            git push origin HEAD:feat/scanner-evidence-trace-20261106
          fi
